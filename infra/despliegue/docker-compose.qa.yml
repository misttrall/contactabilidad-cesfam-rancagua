# Ambientes DEMO/QA en una máquina de la región de Chile (referencia de despliegue, S6).
# NO es para desarrollo local (ver ../../docker-compose.yml). Uso:
#
#   cp .env.qa.example .env.qa            # completar con secretos reales (gestor de secretos)
#   docker compose --env-file .env.qa -f docker-compose.qa.yml up -d --build
#   docker compose --env-file .env.qa -f docker-compose.qa.yml run --rm migrar
#
# Termina TLS un proxy inverso/balanceador delante de `web`, `api` y `keycloak` (443 → 80/3000/8080).
# Nada de datos persistentes ni puertos de Postgres/Redis hacia afuera: solo la red interna.
name: businesshub-${AMBIENTE_NOMBRE:-qa}

x-api-env: &api-env
  AMBIENTE: ${AMBIENTE:-QA}
  API_PORT: '3000'
  PUBLIC_API_URL: ${PUBLIC_API_URL:?}
  WEB_ORIGINS: ${WEB_ORIGIN:?}
  TRUST_PROXY: '1'
  DATABASE_URL: postgresql://businesshub:${POSTGRES_PASSWORD:?}@postgres:5432/businesshub
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
  DATA_ENCRYPTION_KEY_ANTERIORES: ${DATA_ENCRYPTION_KEY_ANTERIORES:-}
  RETENCION_MESES: ${RETENCION_MESES:-12}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?}
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/businesshub/protocol/openid-connect/certs
  KEYCLOAK_ADMIN_CLIENT_ID: businesshub-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_ADMIN_SECRET:?}
  WHATSAPP_MODO: ${WHATSAPP_MODO:-simulador}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: businesshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: businesshub
      TZ: America/Santiago
    # El volumen debe estar en un disco CIFRADO (LUKS / cifrado del proveedor): cifrado en reposo.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U businesshub']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?}
      POSTGRES_DB: keycloak
    volumes: [kcdata:/var/lib/postgresql/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Modo producción (no start-dev). El realm se genera con infra/keycloak/generar-realm.mjs
    # (sin usuarios de prueba, con MFA) y se importa en el primer arranque.
    command: ['start', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_HOSTNAME: ${KC_HOSTNAME:?}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true' # TLS lo termina el proxy
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
    volumes:
      - ./realm-generado.json:/opt/keycloak/data/import/realm.json:ro
      - ../keycloak/theme:/opt/keycloak/themes:ro
    depends_on: [keycloak-db]

  migrar:
    build: { context: ../.., dockerfile: infra/despliegue/Dockerfile.api }
    profiles: ['tareas']
    environment: *api-env
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    working_dir: /repo/apps/api
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ../.., dockerfile: infra/despliegue/Dockerfile.api }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/despliegue/Dockerfile.web
      args:
        VITE_AMBIENTE: ${AMBIENTE:-QA}
        VITE_API_URL: ${PUBLIC_API_URL:?}
        VITE_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?}
    restart: unless-stopped
    environment:
      CSP_API: ${PUBLIC_API_URL:?}
      CSP_ID: ${KEYCLOAK_ORIGEN:?}
      CSP_FRAME_ANCESTORS: ${CSP_FRAME_ANCESTORS:-'none'}
    ports: ['127.0.0.1:8080:80']

  # Cloudflare Tunnel (perfil `tunel`): publica api y keycloak sin abrir puertos de la máquina.
  # Los hostnames públicos se configuran en Cloudflare Zero Trust → Tunnels → Public hostnames:
  #   api.<dominio>  → http://api:3000        id.<dominio> → http://keycloak:8080
  cloudflared:
    image: cloudflare/cloudflared:latest # fijar una versión al desplegar (Dependabot la actualiza)
    profiles: ['tunel']
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on: [api, keycloak]

volumes:
  pgdata:
  redisdata:
  kcdata:
